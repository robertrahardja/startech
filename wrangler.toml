name = "startech"
compatibility_date = "2025-03-01"

main = "./worker/index.ts"

# Versioned preview URLs on *.workers.dev, so a build can be reviewed before
# it is promoted to the custom domains below. Uploading a version does not
# affect production traffic; only `wrangler versions deploy` does.
preview_urls = true

routes = [
  { pattern = "startech-innovation.com", custom_domain = true },
  { pattern = "www.startech-innovation.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "startech-demos"
database_id = "dd762257-3eee-4e21-897f-6eb580c4f0c7"

# Shared across every isolate/edge location, so demo rate limiting and the
# manual blocklist actually hold under distributed traffic instead of
# resetting whenever Cloudflare spins up a fresh isolate.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2036e34038274bd6b35d9fb9b1c75758"
preview_id = "90fbb26528aa42e8bd5cdae6bb9f153a"

[vars]
ENVIRONMENT = "production"
